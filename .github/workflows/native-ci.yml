name: Native CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact source commit to qualify
        required: true
      inspection_run:
        description: Product artifact run to verify and measure without compiling
        required: false
      mesh_only:
        description: Only run the pinned release mesh gate
        type: boolean
        default: false
      restore_only:
        description: Only qualify Windows locked runtime inputs
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || inputs.commit }}-${{ inputs.restore_only || false }}-${{ inputs.mesh_only || false }}-${{ inputs.inspection_run || false }}
  cancel-in-progress: true

jobs:
  native:
    if: inputs.restore_only != true && inputs.mesh_only != true && !inputs.inspection_run
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-ios
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes just libdbus-1-dev libfuse3-dev libgtk-3-dev libgtk-4-dev libadwaita-1-dev libxdo-dev pkg-config protobuf-compiler
      - name: Verify exact source
        env:
          EXPECTED_COMMIT: ${{ inputs.commit || github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Run development checks and production Core tests
        run: just verify-fast
      - name: Check iOS WebRTC platform dependencies
        run: cargo check --locked --target aarch64-apple-ios -p nix@0.26.4
      - name: Run CLI and daemon sync journeys
        run: cargo test --locked -p idrive --test cli_e2e --test daemon_sync_matrix -- --test-threads=1
      - name: Check Linux desktop
        run: cargo check --locked --manifest-path linux/Cargo.toml --all-targets
      - name: Verify locks remain unchanged
        run: git diff --exit-code -- Cargo.lock linux/Cargo.lock

  windows-inputs:
    if: inputs.restore_only == true
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.420'
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Qualify locked runtime downloads without compiling the app
        shell: pwsh
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./scripts/test-windows-build-inputs.ps1 -ResultPath "$env:RUNNER_TEMP/windows-input-results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-input-results
          path: ${{ runner.temp }}/windows-input-results.json
          if-no-files-found: error

  release-mesh:
    if: inputs.mesh_only == true
    uses: irislib/iris-stack/.github/workflows/product-lab.yml@cec9501659b9cf08f9600e3f14987cad6ca1e7d3
    with:
      lab_rev: cec9501659b9cf08f9600e3f14987cad6ca1e7d3
      drive_rev: ${{ inputs.commit }}
      chat_rev: dc524968bab6b93d770cc1d7e8e81414293c37ad
      htree_version: '0.2.150'

  inspect-products:
    if: inputs.inspection_run
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Download exact source products
        env:
          GH_TOKEN: ${{ github.token }}
          PRODUCT_RUN: ${{ inputs.inspection_run }}
          EXPECTED_COMMIT: ${{ inputs.commit }}
        run: |
          test "$(git -C source rev-parse HEAD)" = "$EXPECTED_COMMIT"
          gh run download "$PRODUCT_RUN" --repo "$GITHUB_REPOSITORY" --pattern "drive-*-$EXPECTED_COMMIT" --dir "$RUNNER_TEMP/products"
      - name: Verify receipts and measure actual extracted payloads
        run: python3 tooling/scripts/inspect-hosted-products.py source "$RUNNER_TEMP/products" "$RUNNER_TEMP/product-sizes.json"
      - uses: actions/upload-artifact@v4
        with:
          name: verified-product-sizes
          path: ${{ runner.temp }}/product-sizes.json
          if-no-files-found: error
