name: Native CI

on:
  pull_request:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact source commit to qualify
        required: true
      restore_only:
        description: Only qualify Windows locked runtime inputs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-ci-${{ github.event.pull_request.number || inputs.commit }}-${{ inputs.restore_only || false }}
  cancel-in-progress: true

jobs:
  native:
    if: inputs.restore_only != true
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '2'
      TERM: dumb
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: aarch64-apple-ios
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes just libdbus-1-dev libfuse3-dev libgtk-3-dev libgtk-4-dev libadwaita-1-dev libxdo-dev pkg-config protobuf-compiler
      - name: Verify exact source
        env:
          EXPECTED_COMMIT: ${{ inputs.commit || github.event.pull_request.head.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_COMMIT"
      - name: Run development checks and production Core tests
        run: just verify-fast
      - name: Check iOS WebRTC platform dependencies
        run: cargo check --locked --target aarch64-apple-ios -p nix@0.26.4
      - name: Run CLI and daemon sync journeys
        run: cargo test --locked -p idrive --test cli_e2e --test daemon_sync_matrix -- --test-threads=1
      - name: Check Linux desktop
        run: cargo check --locked --manifest-path linux/Cargo.toml --all-targets
      - name: Verify locks remain unchanged
        run: git diff --exit-code -- Cargo.lock linux/Cargo.lock

  windows-inputs:
    if: inputs.restore_only == true
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.420'
      - name: Qualify locked runtime downloads without compiling the app
        shell: pwsh
        run: ./scripts/test-windows-build-inputs.ps1 -ResultPath "$env:RUNNER_TEMP/windows-input-results.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-runtime-input-results
          path: ${{ runner.temp }}/windows-input-results.json
          if-no-files-found: error
