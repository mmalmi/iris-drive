name: Verify published catalog through a Drive candidate
on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      product_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_ROOT: ${{ github.workspace }}/source
      SOURCE_COMMIT: ${{ inputs.commit }}
      PRODUCT_INPUTS: ${{ github.workspace }}/products
      CHECK_OUTPUT: ${{ github.workspace }}/catalog-check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Install verified catalog check tools
        run: |
          bash tooling/scripts/hosted-tool-archives.sh node
          bash tooling/scripts/hosted-tool-archives.sh pnpm
      - name: Install verified FUSE runtime
        run: |
          package=libfuse3-3_3.14.0-5build1_amd64.deb
          curl --proto '=https' --proto-redir '=https' --fail --location --retry 2 \
            --max-time 60 --max-filesize 100000 --output "$RUNNER_TEMP/$package" \
            "https://archive.ubuntu.com/ubuntu/pool/main/f/fuse3/$package"
          # SHA-256 from Ubuntu's Noble amd64 package download index.
          (
            cd "$RUNNER_TEMP"
            printf '%s  %s\n' 3042159c6d7d4dcb3df9d49cd21e49ecb57f4ba8c4153a72102f512a4fc534a2 "$package" \
              | sha256sum --check --strict
          )
          sudo dpkg --install "$RUNNER_TEMP/$package"
      - name: Install pinned Hashtree source checkout tools
        run: node tooling/scripts/release-tools.mjs install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.product_run }}
          name: drive-linux-${{ inputs.commit }}
          path: products
      - name: Verify the catalog with the packaged Linux bridge
        run: |
          mkdir -p "$CHECK_OUTPUT"
          node tooling/scripts/check-hosted-catalog.mjs 2>&1 | tee "$CHECK_OUTPUT/catalog.log"
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: catalog-check-${{ inputs.commit }}
          path: |
            catalog-check/receipt.json
            catalog-check/catalog.log
          if-no-files-found: ignore
          retention-days: 7
