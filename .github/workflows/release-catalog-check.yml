name: Verify published catalog through a Drive candidate
on:
  workflow_call:
    inputs:
      commit:
        required: true
        type: string
      product_run:
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  catalog:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_ROOT: ${{ github.workspace }}/source
      SOURCE_COMMIT: ${{ inputs.commit }}
      PRODUCT_INPUTS: ${{ github.workspace }}/products
      CHECK_OUTPUT: ${{ github.workspace }}/catalog-check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - name: Checkout reviewed input installers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: irislib/iris-chat-rs
          ref: 061c1747575e216db4506d12f2d358dd8c8e0241
          persist-credentials: false
          path: build-inputs
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /linux/scripts/pinned-apt.sh
            /linux/build-inputs/apt-snapshots.tsv
      - name: Install verified catalog check tools
        run: |
          bash tooling/scripts/hosted-tool-archives.sh node
          bash tooling/scripts/hosted-tool-archives.sh pnpm
          sudo bash build-inputs/linux/scripts/pinned-apt.sh ubuntu-noble libfuse3-3
      - name: Install pinned Hashtree source checkout tools
        run: node tooling/scripts/release-tools.mjs install
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.product_run }}
          name: drive-linux-${{ inputs.commit }}
          path: products
      - name: Verify the catalog with the packaged Linux bridge
        run: |
          mkdir -p "$CHECK_OUTPUT"
          node tooling/scripts/check-hosted-catalog.mjs 2>&1 | tee "$CHECK_OUTPUT/catalog.log"
        shell: bash
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: catalog-check-${{ inputs.commit }}
          path: |
            catalog-check/receipt.json
            catalog-check/catalog.log
          if-no-files-found: ignore
          retention-days: 7
