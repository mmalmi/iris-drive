name: Unsigned native products

on:
  pull_request:
    types: [opened, reopened]
    paths:
      - '.github/workflows/release-products.yml'
      - 'scripts/build-hosted-products.mjs'
      - 'scripts/hosted-product-receipt*'
  workflow_dispatch:
    inputs:
      commit:
        description: Exact source commit to build
        required: true
      platform:
        description: One product platform, all, or an existing product check
        required: true
        default: all

      daemon_ack_only:
        description: Run only the existing stalled-relay approval journey for native-check
        required: false
        type: boolean
        default: false

      fixture_readiness_only:
        description: Run approval observer and delayed peer fixture regressions for native-check
        required: false
        type: boolean
        default: false

      web_commit:
        description: Exact published web source for web-check
        required: false

      ios_prefix_run:
        description: Previous canonical run with successful pre-Files assertions
        required: false

      debug_run:
        description: Simulator Debug artifact run for ios-check
        required: false
      release_run:
        description: Artifact run ID for a prepared product check
        required: false
      mac_run:
        description: macOS Release artifact run for ios-check
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: unsigned-products-${{ github.ref }}-${{ inputs.platform || 'all' }}
  cancel-in-progress: false

jobs:
  android-tests:
    if: inputs.platform == 'android-tests'
    uses: ./.github/workflows/release-android-tests.yml
    with:
      commit: ${{ inputs.commit }}
      product_run: ${{ inputs.release_run }}
  native-check:
    if: inputs.platform == 'native-check'
    uses: ./.github/workflows/release-native-check.yml
    with:
      commit: ${{ inputs.commit }}
      daemon_ack_only: ${{ inputs.daemon_ack_only || false }}
      fixture_readiness_only: ${{ inputs.fixture_readiness_only || false }}
  web-check:
    if: inputs.platform == 'web-check'
    uses: ./.github/workflows/release-web-check.yml
    with:
      commit: ${{ inputs.commit }}
      web_commit: ${{ inputs.web_commit }}
      product_run: ${{ inputs.release_run }}
  linux-check:
    if: inputs.platform == 'linux-check'
    uses: ./.github/workflows/release-linux-check.yml
    with:
      commit: ${{ inputs.commit }}
      product_run: ${{ inputs.release_run }}
  catalog-check:
    if: inputs.platform == 'catalog-check'
    uses: ./.github/workflows/release-catalog-check.yml
    with:
      commit: ${{ inputs.commit }}
      product_run: ${{ inputs.release_run }}
  linux-catalog-check:
    if: inputs.platform == 'linux' || inputs.platform == 'all'
    needs: products
    uses: ./.github/workflows/release-catalog-check.yml
    with:
      commit: ${{ inputs.commit }}
      product_run: ${{ github.run_id }}
  ios-check:
    if: inputs.platform == 'ios-check'
    uses: ./.github/workflows/release-ios-check.yml
    with:
      commit: ${{ inputs.commit }}
      ios_prefix_run: ${{ inputs.ios_prefix_run }}
      debug_run: ${{ inputs.debug_run }}
      release_run: ${{ inputs.release_run }}
      mac_run: ${{ inputs.mac_run }}
  products:
    if: inputs.platform != 'ios-check' && inputs.platform != 'native-check' && inputs.platform != 'linux-check' && inputs.platform != 'catalog-check' && inputs.platform != 'web-check' && inputs.platform != 'android-tests'
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.platform == 'windows' && 'windows-2025' || (startsWith(matrix.platform, 'macos') || startsWith(matrix.platform, 'ios')) && 'macos-15' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        platform: ${{ fromJSON(inputs.platform && inputs.platform != 'all' && format('["{0}"]', inputs.platform) || '["macos-release","macos-debug","ios-release","ios-sim-debug","ios-sim-release","android","linux","windows"]') }}
    env:
      SOURCE_COMMIT: ${{ inputs.commit || github.event.pull_request.head.sha || github.sha }}
      SOURCE_ROOT: ${{ github.workspace }}/source
      PRODUCT_OUTPUT: ${{ github.workspace }}/products
      PRODUCT_PLATFORM: ${{ matrix.platform }}
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: tooling
          persist-credentials: false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: source
          ref: ${{ env.SOURCE_COMMIT }}
          persist-credentials: false
      - name: Checkout reviewed input installers
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: irislib/iris-chat-rs
          ref: 061c1747575e216db4506d12f2d358dd8c8e0241
          persist-credentials: false
          path: build-inputs
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /linux/scripts/pinned-apt.sh
            /linux/build-inputs/apt-snapshots.tsv
            /scripts/release-build-inputs.py
            /scripts/release-build-inputs.json
            /scripts/android-release-inputs.py
            /scripts/android-release-inputs.json
            /android/gradle/wrapper/gradle-wrapper.jar
            /android/gradle/wrapper/gradle-wrapper.properties
      - name: Install verified Node.js
        shell: bash
        run: bash tooling/scripts/hosted-tool-archives.sh node
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install verified .NET SDK
        if: runner.os == 'Windows'
        shell: bash
        run: bash tooling/scripts/hosted-tool-archives.sh dotnet
      - name: Select submission-compatible iOS SDK
        if: startsWith(matrix.platform, 'ios')
        run: |
          test -d /Applications/Xcode_26.2.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_26.2.app/Contents/Developer' >> "$GITHUB_ENV"
          /Applications/Xcode_26.2.app/Contents/Developer/usr/bin/xcodebuild -version
      - name: Install verified Rust and Apple build tools
        shell: bash
        run: |
          args=()
          case "$PRODUCT_PLATFORM" in
            macos-*) args+=(--tools macos) ;;
            ios-sim-*) args+=(--tools ios --target aarch64-apple-ios-sim) ;;
            ios-*) args+=(--tools ios --target aarch64-apple-ios) ;;
            android) args+=(--target aarch64-linux-android) ;;
            windows) args+=(--bash "$(cygpath -w "$BASH")") ;;
          esac
          python3 -B build-inputs/scripts/release-build-inputs.py --install --work "$RUNNER_TEMP/iris-rust" "${args[@]}"
      - name: Install verified Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          packages=(cmake libdbus-1-dev pkg-config pkgconf pkgconf-bin protobuf-compiler)
          if [[ "$PRODUCT_PLATFORM" == linux ]]; then
            packages+=(libfuse3-dev libgtk-4-dev libadwaita-1-dev libxdo-dev)
          fi
          sudo bash build-inputs/linux/scripts/pinned-apt.sh ubuntu-noble "${packages[@]}"
      - name: Install verified Android tools
        if: matrix.platform == 'android'
        shell: bash
        run: |
          bash tooling/scripts/hosted-tool-archives.sh gradle
          python3 -B build-inputs/scripts/android-release-inputs.py --install \
            --work "$RUNNER_TEMP/iris-android" --rust-work "$RUNNER_TEMP/iris-rust"
          test -x "$RUNNER_TEMP/iris-android/sdk/build-tools/36.0.0/apksigner"
      - name: Install verified Debian packager
        if: matrix.platform == 'linux'
        shell: bash
        run: bash tooling/scripts/hosted-tool-archives.sh cargo-deb
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: cache
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/target
            source/linux/target
          key: drive-products-pinned-${{ matrix.platform }}-${{ runner.arch }}-${{ hashFiles('source/Cargo.lock', 'source/linux/Cargo.lock') }}
          restore-keys: drive-products-pinned-${{ matrix.platform }}-${{ runner.arch }}-
      - name: Build source-bound unsigned products
        run: node tooling/scripts/build-hosted-products.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drive-${{ matrix.platform }}-${{ env.SOURCE_COMMIT }}
          path: |
            products/*-products.tar.gz
            products/build-receipt.json
          if-no-files-found: error
          retention-days: 7
      - name: Retain build input receipts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drive-inputs-${{ matrix.platform }}-${{ env.SOURCE_COMMIT }}
          path: |
            ${{ runner.temp }}/iris-rust/receipt.json
            ${{ runner.temp }}/iris-android/receipt.json
          if-no-files-found: warn
          retention-days: 7
      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        if: ${{ !cancelled() && steps.cache.outputs.cache-hit != 'true' }}
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/target
            source/linux/target
          key: ${{ steps.cache.outputs.cache-primary-key }}
