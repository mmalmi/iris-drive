name: Build isolated native queued cache-pressure proof

on:
  workflow_call:
    inputs:
      commit:
        type: string
        required: true
      daemon_ack_only:
        type: boolean
        required: false
        default: false
      fixture_readiness_only:
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  state:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_DEV_DEBUG: '0'
      PROOF_DRIVE_SOURCE: 3277bbe35566e762df0407fb550471cb803f6c2a
      PROOF_CLI_BASE: b1c71987e9f8e9ba685fae296b1148d4b3d835f9
      PROOF_CLI_SOURCE: a0ca61a1d1302cc253c73fb735dc69ead3b9d776
      PROOF_CLI_CRATE_SHA256: 4c692044a77a611977552d0ac0205a81602ef2098232b89b1a993f6bcbdeb34e
      PROOF_CLI_DIFF_SHA256: 0e9d9427a48c927440a120f07b0c48153878c677654e4e729da70d013c2392dc
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: source
          ref: ${{ inputs.commit }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: mmalmi/hashtree
          path: hashtree-source
          ref: ${{ env.PROOF_CLI_SOURCE }}
          fetch-depth: 4
          persist-credentials: false
      - name: Install the verified native toolchain
        run: |
          rustup toolchain install 1.100.0 --profile minimal --no-self-update
          rustup default 1.100.0
          rustc --version | grep -F '1.100.0 (0ef1bc386 2026-11-09)'
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libdbus-1-dev libfuse3-dev libxdo-dev pkg-config protobuf-compiler
      - uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            source/target
          key: drive-state-check-${{ runner.arch }}-${{ hashFiles('source/Cargo.lock') }}-5b4941f92bdb5c39e1d2366407625b42f57022a2
          restore-keys: |
            drive-state-check-${{ runner.arch }}-${{ hashFiles('source/Cargo.lock') }}-
            drive-products-linux-${{ runner.arch }}-
      - name: Verify and apply the normalized Hashtree CLI overlay
        working-directory: source
        run: |
          test "$(git rev-parse HEAD)" = "$PROOF_DRIVE_SOURCE"
          test "$(git -C ../hashtree-source rev-parse HEAD)" = "$PROOF_CLI_SOURCE"
          git -C ../hashtree-source merge-base --is-ancestor "$PROOF_CLI_BASE" "$PROOF_CLI_SOURCE"
          mkdir proof-inputs
          curl --fail --location --silent --show-error https://static.crates.io/crates/hashtree-cli/hashtree-cli-0.4.6.crate -o proof-inputs/hashtree-cli-0.4.6.crate
          printf '%s  %s\n' "$PROOF_CLI_CRATE_SHA256" proof-inputs/hashtree-cli-0.4.6.crate | sha256sum --check --strict
          tar -xf proof-inputs/hashtree-cli-0.4.6.crate -C proof-inputs
          git -C ../hashtree-source --no-pager -c color.ui=false diff --no-ext-diff --no-textconv \
            --abbrev=8 --no-renames --src-prefix=a/ --dst-prefix=b/ "$PROOF_CLI_BASE" "$PROOF_CLI_SOURCE" \
            -- rust/crates/hashtree-cli > proof-inputs/hashtree-cli-overlay.diff
          printf '%s  %s\n' "$PROOF_CLI_DIFF_SHA256" proof-inputs/hashtree-cli-overlay.diff | sha256sum --check --strict
          (
            export GIT_CEILING_DIRECTORIES="$PWD"
            cd proof-inputs/hashtree-cli-0.4.6
            git apply --check -p4 ../hashtree-cli-overlay.diff
            git apply -p4 ../hashtree-cli-overlay.diff
          )
          python3 - <<'PYTHON'
          import os
          from pathlib import Path

          manifest = Path("Cargo.toml")
          assert "[patch.crates-io]" not in manifest.read_text()
          with manifest.open("a") as handle:
              handle.write('\n[patch.crates-io]\nhashtree-cli = { path = "proof-inputs/hashtree-cli-0.4.6" }\n')

          lock = Path("Cargo.lock")
          version = 'name = "hashtree-cli"\nversion = "0.4.6"\n'
          registry = 'source = "registry+https://github.com/rust-lang/crates.io-index"\n'
          checksum = 'checksum = "' + os.environ["PROOF_CLI_CRATE_SHA256"] + '"\n'
          pinned_package = version + registry + checksum
          original = lock.read_text()
          assert original.count(pinned_package) == 1
          lock.write_text(original.replace(pinned_package, version))
          PYTHON
          git diff --check
          git diff -- Cargo.toml Cargo.lock
      - name: Build test-only native Iris Drive CLI
        working-directory: source
        run: |
          df -h "$PWD"
          cargo build --locked -p idrive --bin idrive
          ./target/debug/idrive --version
          mkdir "$RUNNER_TEMP/native-proof"
          tar -cf "$RUNNER_TEMP/native-proof/idrive-linux-amd64-proof.tar" -C target/debug idrive
          sha256sum target/debug/idrive Cargo.toml Cargo.lock > "$RUNNER_TEMP/native-proof/inputs-and-executable.sha256"
          (
            cd "$RUNNER_TEMP/native-proof"
            sha256sum idrive-linux-amd64-proof.tar > archive.sha256
          )
          {
            printf 'Drive source %s\nHashtree CLI base %s\nHashtree CLI overlay source %s\n' "$PROOF_DRIVE_SOURCE" "$PROOF_CLI_BASE" "$PROOF_CLI_SOURCE"
            printf 'Crate SHA256 %s\nOverlay SHA256 %s\n' "$PROOF_CLI_CRATE_SHA256" "$PROOF_CLI_DIFF_SHA256"
            printf 'Cargo profile dev, debug=0, incremental=false\n'
            rustc -Vv
            cargo -V
            cat /etc/os-release
            dpkg-query -W libdbus-1-dev libfuse3-dev libxdo-dev pkg-config protobuf-compiler
            ldd target/debug/idrive
          } > "$RUNNER_TEMP/native-proof/build-provenance.txt"
          cat "$RUNNER_TEMP/native-proof/inputs-and-executable.sha256"
          cat "$RUNNER_TEMP/native-proof/archive.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: idrive-queued-cache-pressure-proof-only-linux-amd64
          path: ${{ runner.temp }}/native-proof/
          if-no-files-found: error
          retention-days: 3
